<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Playground</title>

    <!-- Bootstrap & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/addon/edit/closebrackets.min.js"></script>

    <!-- CodeMirror Themes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/theme/monokai.min.css">

    <!-- JSZip for exporting all codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Inter', 'Segoe UI', sans-serif; background: #f4f6f9; }

        nav.navbar { background: var(--paper) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        nav.navbar .navbar-brand { font-size: 1.25rem; font-weight: 700; color: var(--ink) !important; }
        nav.navbar .nav-link { color: var(--muted) !important; transition: color 0.2s ease; }
        nav.navbar .nav-link:hover, nav.navbar .nav-link.active { color: var(--rust) !important; }
        .dark-theme nav.navbar { background: #0b1220 !important; }
        .dark-theme nav.navbar .navbar-brand, .dark-theme nav.navbar .nav-link { color: #e6eef8 !important; }

        .playground-container { display: flex; flex-direction: column; height: 100%; margin-top: 56px; }

        .top-bar { background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center;
            padding: 12px 20px; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }

        #inputPanel { background: #fafafa; border-bottom: 1px solid #ddd; padding: 10px 20px;
            display: flex; align-items: center; gap: 10px; }

        #inputPanel textarea { flex: 1; resize: none; height: 50px; border-radius: 8px;
            border: 1px solid #ccc; padding: 8px; font-size: 0.95rem; }

        .split-container { display: flex; flex: 1; overflow: hidden; background: transparent; padding: 10px; }

        .panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff;
            border-radius: 12px; margin: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }

        .divider { width: 6px; background: #e0e0e0; cursor: col-resize; border-radius: 10px; }

        .CodeMirror { height: 100%; border-radius: 12px 12px 0 0; font-size: 15px; padding: 10px; }

        .output-box { background: #1e1e1e; color: #f8f9fa; padding: 12px; border-radius: 0 0 12px 12px;
            font-family: monospace; overflow-x: auto; white-space: pre-wrap; flex: 1; min-height: 50px; }

        footer { text-align: center; background: #212529; color: #fff; padding: 10px; font-size: 0.9rem; }

        .dark-theme { background: #1e1e1e; color: #f8f9fa; }
        .dark-theme .top-bar, .dark-theme #inputPanel { background: #2b2b2b; color: #f8f9fa; }
        .dark-theme .panel { background: #222; box-shadow: 0 4px 10px rgba(255,255,255,0.05); }
        .dark-theme .CodeMirror { background: #1e1e1e; color: #f8f9fa; }
        .dark-theme .output-box { background: #111; }
        * { transition: background 0.3s, color 0.3s; }
    </style>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>

<body class="portfolio-page">

<nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container-fluid px-4">
        <a href="/" class="navbar-brand fw-bold" th:text="${profile?.name}">Himanshu Singh</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
            <ul class="navbar-nav align-items-center mb-2 mb-lg-0">
                <li class="nav-item"><a href="/" class="nav-link active">Home</a></li>
                <li class="nav-item"><a href="/judge0" class="nav-link">Compiler</a></li>
                <li class="nav-item"><a href="/notes/notepad" class="nav-link">Notepad</a></li>
                <li class="nav-item"><a href="/admin/login" class="nav-link" target="_blank">Admin</a></li>
                <li class="nav-item ms-lg-3">
                    <button id="themeToggle" class="btn btn-warning btn-sm"><i class="fas fa-moon"></i></button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="playground-container">
    <div class="top-bar">
        <select id="language" class="form-select w-auto">
            <option value="java:4" selected>Java 17</option>
            <option value="python3:3">Python 3.9</option>
            <option value="c:5">C</option>
            <option value="cpp:5">C++</option>
            <option value="javascript:4">JavaScript</option>
        </select>
        <button id="runBtn" class="btn btn-success"><i class="fas fa-play"></i> Run</button>
        <button id="suggestBtn" class="btn btn-secondary"><i class="fas fa-lightbulb"></i> Suggest</button>
        <button id="toggleInput" class="btn btn-outline-primary btn-sm ms-auto"><i class="fas fa-terminal"></i> Input</button>
    </div>

    <div id="inputPanel" style="display:none;">
        <textarea id="input" placeholder="Enter program input..."></textarea>
    </div>

    <div class="split-container">
        <div class="panel editor-panel">
            <textarea id="code">// Write your code here</textarea>
        </div>
        <div class="divider"></div>
        <div class="panel output-panel">
            <pre id="output" class="output-box"></pre>
        </div>
    </div>
</div>

<footer>
    &copy; 2024 <span th:text="${profile?.name}">Himanshu Singh</span>. All rights reserved.
</footer>

<script>
    const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        lineNumbers: true, matchBrackets: true, autoCloseBrackets: true,
        mode: "text/x-java", theme: "default"
    });

    const languageSelect = document.getElementById("language");
    const outputBox = document.getElementById("output");

    languageSelect.addEventListener("change", function() {
        const lang = this.value.split(":")[0];
        if(lang==="java") editor.setOption("mode","text/x-java");
        else if(lang==="cpp"||lang==="c") editor.setOption("mode","text/x-c++src");
        else if(lang==="python3") editor.setOption("mode","python");
        else if(lang==="javascript") editor.setOption("mode","javascript");
    });

    // === Theme toggle ===
    const themeBtn = document.getElementById("themeToggle");
    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-theme");
        editor.refresh();
        themeBtn.innerHTML = document.body.classList.contains("dark-theme")
            ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // === Suggest button ===
    document.getElementById("suggestBtn").addEventListener("click", function() {
        const lang = languageSelect.value.split(":")[0];
        if(lang==="java") editor.setValue("public class Main {\n  public static void main(String[] args){\n    System.out.println(\"Hello, World!\");\n  }\n}");
        else if(lang==="python3") editor.setValue("print('Hello, World!')");
        else if(lang==="cpp") editor.setValue("#include <iostream>\nusing namespace std;\nint main(){\n  cout << \"Hello, World!\";\n}");
        else if(lang==="c") editor.setValue("#include <stdio.h>\nint main(){\n  printf(\"Hello, World!\\n\");\n}");
        else if(lang==="javascript") editor.setValue("console.log('Hello, World!');");
    });

    // === Run code (JDoodle API) ===
    document.getElementById("runBtn").addEventListener("click", async () => {
        const code = editor.getValue();
        const input = document.getElementById("input").value;
        const [language, versionIndex] = languageSelect.value.split(":");
        outputBox.textContent = "⏳ Running...";
        try {
            const response = await fetch('/api/jdoodle/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ script: code, language, versionIndex, stdin: input })
            });
            const result = await response.json();
            if (result.success) outputBox.textContent = result.output || "No output";
            else outputBox.textContent = "❌ Error: " + (result.error || "Unknown error");
        } catch (err) { outputBox.textContent = "⚠️ Error: " + err.message; }
    });

    // === Toggle input panel ===
    document.getElementById("toggleInput").addEventListener("click", () => {
        const panel = document.getElementById("inputPanel");
        panel.style.display = panel.style.display === "none" ? "flex" : "none";
    });

    // === Split resizable ===
    const divider = document.querySelector(".divider");
    const editorPanel = document.querySelector(".editor-panel");
    const outputPanel = document.querySelector(".output-panel");
    let isResizing = false;
    divider.addEventListener("mousedown", () => { isResizing = true; document.body.style.cursor = "col-resize"; });
    document.addEventListener("mousemove", (e) => {
        if(!isResizing) return;
        const containerWidth = document.querySelector(".split-container").offsetWidth;
        let newWidth = e.clientX - editorPanel.getBoundingClientRect().left;
        if(newWidth < 200) newWidth = 200;
        if(newWidth > containerWidth - 200) newWidth = containerWidth - 200;
        editorPanel.style.flex = "0 0 " + newWidth + "px";
        outputPanel.style.flex = "1"; editor.refresh();
    });
    document.addEventListener("mouseup", () => { isResizing = false; document.body.style.cursor = "default"; });

    // === Save / Load per language ===
    window.addEventListener("load", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sharedCode = urlParams.get("code");
        const sharedLang = urlParams.get("lang");
        if(sharedCode && sharedLang){ languageSelect.value = sharedLang+":4"; editor.setValue(decodeURIComponent(sharedCode)); }

        const lang = languageSelect.value.split(":")[0];
        const savedCode = localStorage.getItem("code_" + lang);
        if (savedCode) editor.setValue(savedCode);
    });

    languageSelect.addEventListener("change", () => {
        const lang = languageSelect.value.split(":")[0];
        editor.setValue(localStorage.getItem("code_" + lang) || "");
    });

    document.getElementById("runBtn").addEventListener("click", () => {
        const lang = languageSelect.value.split(":")[0];
        localStorage.setItem("code_" + lang, editor.getValue());
    });

    // === Download code ===
    const downloadBtn = document.createElement("button");
    downloadBtn.textContent = "⬇️ Download Code";
    downloadBtn.className = "btn btn-secondary ms-2";
    document.querySelector(".top-bar").appendChild(downloadBtn);
    downloadBtn.addEventListener("click", () => {
        const lang = languageSelect.value.split(":")[0];
        const code = editor.getValue();
        const blob = new Blob([code], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `code.${getFileExtension(lang)}`;
        a.click();
    });

    // === Copy output ===
    const copyBtn = document.createElement("button");
    copyBtn.textContent = "📋 Copy Output";
    copyBtn.className = "btn btn-outline-light btn-sm mt-2";
    outputBox.insertAdjacentElement("afterend", copyBtn);
    copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(outputBox.innerText);
        copyBtn.textContent = "✅ Copied!";
        setTimeout(() => (copyBtn.textContent = "📋 Copy Output"), 1500);
    });

    // === Auto-save timer ===
    setInterval(() => {
        const lang = languageSelect.value.split(":")[0];
        localStorage.setItem("code_" + lang, editor.getValue());
    }, 10000);

    // === Font size + theme picker ===
    const fontSelect = document.createElement("select");
    fontSelect.innerHTML = `<option value="13px">Small</option><option value="15px" selected>Medium</option><option value="18px">Large</option>`;
    fontSelect.className = "form-select w-auto ms-2";
    const themeSelect = document.createElement("select");
    themeSelect.innerHTML = `<option value="default">Light</option><option value="dracula">Dracula</option><option value="monokai">Monokai</option>`;
    themeSelect.className = "form-select w-auto ms-2";
    document.querySelector(".top-bar").appendChild(fontSelect);
    document.querySelector(".top-bar").appendChild(themeSelect);
    fontSelect.addEventListener("change", e => document.querySelector(".CodeMirror").style.fontSize = e.target.value);
    themeSelect.addEventListener("change", e => editor.setOption("theme", e.target.value));

    // === Export all ===
    const exportBtn = document.createElement("button");
    exportBtn.className = "btn btn-dark ms-2";
    exportBtn.innerHTML = '<i class="fas fa-folder"></i> Export All';
    document.querySelector(".top-bar").appendChild(exportBtn);
    exportBtn.addEventListener("click", async () => {
        const zip = new JSZip();
        const langs = ["java","python3","cpp","c","javascript"];
        langs.forEach(l => {
            const code = localStorage.getItem("code_"+l);
            if(code) zip.file(`code_${l}.${getFileExtension(l)}`, code);
        });
        const blob = await zip.generateAsync({type:"blob"});
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob); a.download="my_codes.zip"; a.click();
    });

    // === History feature ===
    function saveHistory(lang, code){
        let h=JSON.parse(localStorage.getItem("history_"+lang)||"[]");
        h.unshift({time:new Date().toLocaleTimeString(), code});
        h=h.slice(0,5);
        localStorage.setItem("history_"+lang, JSON.stringify(h));
    }
    document.getElementById("runBtn").addEventListener("click", ()=>{
        const lang=languageSelect.value.split(":")[0];
        saveHistory(lang,editor.getValue());
    });

    const histBtn=document.createElement("button");
    histBtn.className="btn btn-outline-dark ms-2";
    histBtn.innerHTML='<i class="fas fa-clock"></i> History';
    document.querySelector(".top-bar").appendChild(histBtn);
    histBtn.addEventListener("click",()=>{
        const lang=languageSelect.value.split(":")[0];
        const h=JSON.parse(localStorage.getItem("history_"+lang)||"[]");
        if(h.length===0)return alert("No history found!");
        let msg=`🕘 Last ${h.length} versions of ${lang}:\n\n`;
        h.forEach((e,i)=>msg+=`${i+1}. ${e.time}\n`);
        const c=prompt(msg+"\nEnter version number to load:");
        if(c && h[c-1]) editor.setValue(h[c-1].code);
    });

    // === Share code feature ===
    const shareBtn = document.createElement("button");
    shareBtn.className = "btn btn-info ms-2";
    shareBtn.innerHTML = '<i class="fas fa-share-alt"></i> Share';
    document.querySelector(".top-bar").appendChild(shareBtn);
    shareBtn.addEventListener("click", () => {
        const lang = languageSelect.value.split(":")[0];
        const code = encodeURIComponent(editor.getValue());
        const url = `${window.location.origin}${window.location.pathname}?code=${code}&lang=${lang}`;
        navigator.clipboard.writeText(url);
        alert("✅ Shareable link copied to clipboard!");
    });

    function getFileExtension(lang){
        if(lang==="java")return"java";
        if(lang==="python3")return"py";
        if(lang==="cpp")return"cpp";
        if(lang==="c")return"c";
        if(lang==="javascript")return"js";
        return"txt";
    }
</script>
</body>
</html>
