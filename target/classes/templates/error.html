<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .error-page-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error-card {
            max-width: 450px;
            width: 100%;
            text-align: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .error-card .card-header {
            background: #dc3545;
            color: #fff;
            font-weight: 600;
            font-size: 1.5rem;
            padding: 1rem;
        }
        .error-profile-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin: 1rem 0;
            border: 3px solid #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .error-card p {
            margin-bottom: 0.75rem;
        }
        .error-btns a {
            flex: 1;
            text-decoration: none;
        }
        .error-btns {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        @media (max-width: 576px) {
            .error-card {
                max-width: 90%;
            }
            .error-btns {
                flex-direction: column;
            }
        }
    </style>
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid justify-content-between">
        <span class="navbar-brand fw-semibold">Portfolio Error</span>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">Portfolio Home</a>
            <a href="/admin/login" class="btn btn-outline-light btn-sm ms-2">Admin Login</a>
        </div>
    </div>
</nav>

<div class="error-page-container">
    <div class="card error-card">
        <div class="card-header">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Something Went Wrong
        </div>
        <div class="card-body">
            <img src="/images/profile.jpg" alt="Profile" class="error-profile-img">
            <p class="lead fw-semibold">An unexpected error occurred.</p>
            <p>If your session ended or you logged out, you can return to the portfolio home or log in as admin again.</p>
            <div class="error-btns">
                <a href="/" class="btn btn-primary">Portfolio Home</a>
                <a href="/admin/login" class="btn btn-secondary">Admin Login</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
