<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jsPDF + html2canvas for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            font-family: 'Segoe UI', sans-serif;
        }

        /* Certification Card */
        .cert-card {
            transition: transform 0.4s, box-shadow 0.4s;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        .cert-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        /* Badge animations */
        .org-badge {
            font-weight: 500;
            font-size: 0.85rem;
            color: #fff;
            padding: 0.3rem 0.7rem;
            border-radius: 10px;
            background: linear-gradient(45deg, #0d6efd, #6f42c1, #fd7e14, #20c997, #ffc107, #dc3545);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-verified {
            background-color: #198754;
            color: #fff;
            position: relative;
        }
        .badge-verified::after {
            content: "✨";
            position: absolute;
            top: -4px;
            right: -6px;
            animation: sparkle 1.5s infinite;
            font-size: 1rem;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5);}
            50% { opacity: 1; transform: scale(1);}
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .badge-pending { background-color: #6c757d; color: #fff; }
        #pdfModal iframe { width: 100%; height: 80vh; border: none; border-radius: 0 0 15px 15px; }

        .card-title { font-weight: 600; color: #0d6efd; }
        footer { background: #212529; color: #fff; }
        .footer-text a { color: #0d6efd; text-decoration: none; }
        .footer-text a:hover { text-decoration: underline; }

        /* Animations */
        .fade-in { animation: fadeIn 1s ease forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; } }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .org-badge { font-size: 0.75rem; padding: 0.25rem 0.5rem; }
            .card-title { font-size: 1rem; }
            .form-control-lg, .form-select-lg { font-size: 0.9rem; }
        }

        /* Theme support */
        .dark-theme {
            background: linear-gradient(90deg, #0f1723, #111827);
            color: #e6eef8;
        }
        .dark-theme .navbar { background: #0b1220 !important; }
        .dark-theme .card { background: #0f1723; border-color: rgba(255,255,255,0.04); color: #e6eef8; }
        .dark-theme .org-badge { filter: brightness(0.95); }
        .dark-theme .badge-pending { background-color: #444; }
        .top-controls .btn { white-space: nowrap; }
        .stats-panel { min-width: 220px; }
    </style>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page d-flex flex-column min-vh-100">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Himanshu Singh</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/certifications">Certifications</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Shared banner placeholder (will appear when using share links) -->
<div id="sharedBannerPlaceholder"></div>

<!-- Main content -->
<div class="container flex-grow-1 py-5">
    <h2 class="mb-3 text-center display-6 fw-bold">Certifications</h2>

    <!-- Top controls: search, filter, sort, exports, theme, stats -->
    <div class="row mb-4 g-2 align-items-center top-controls">
        <div class="col-sm-12 col-md-4">
            <input type="text" id="certSearch" class="form-control form-control-lg" placeholder="Search by name or organization...">
        </div>

        <div class="col-sm-6 col-md-2">
            <select id="organizationFilter" class="form-select form-select-lg">
                <option value="">All Organizations</option>
            </select>
        </div>

        <div class="col-sm-6 col-md-2">
            <select id="sortBy" class="form-select form-select-lg">
                <option value="name">Sort: Name (A → Z)</option>
                <option value="date_desc">Sort: Issue Date (Newest)</option>
                <option value="date_asc">Sort: Issue Date (Oldest)</option>
                <option value="verified">Sort: Verified First</option>
            </select>
        </div>

        <div class="col-sm-12 col-md-4 d-flex gap-2 justify-content-end">
            <div class="d-flex gap-2">
                <button id="exportPdfBtn" class="btn btn-outline-primary"><i class="bi bi-file-earmark-pdf"></i> Export PDF</button>
                <button id="exportCsvBtn" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-spreadsheet"></i> Export CSV</button>
                <button id="themeToggleBtn" class="btn btn-outline-warning"><i class="bi bi-moon-stars"></i> Theme</button>
            </div>
        </div>
    </div>

    <!-- Stats + Cache notice -->
    <div class="row mb-3 align-items-center">
        <div class="col-md-8">
            <div id="cacheNotice" class="alert alert-info d-none p-2 mb-0">Using cached data (offline mode).</div>
        </div>
        <div class="col-md-4 d-flex justify-content-end">
            <div class="card stats-panel p-2 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="small text-muted">Total Certificates</div>
                        <div id="totalCount" class="h5 mb-0">0</div>
                    </div>
                    <div class="text-end">
                        <div class="small text-muted">Verified %</div>
                        <div id="verifiedPct" class="h5 mb-0">0%</div>
                    </div>
                    <div class="text-end ms-3">
                        <div class="small text-muted">Pending %</div>
                        <div id="pendingPct" class="h5 mb-0">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Certification Cards -->
    <div class="row" id="certTableBody">
        <div class="col-12 text-center">Loading...</div>
    </div>
</div>

<!-- PDF Modal (used for previewing certificate files) -->
<div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Certificate Preview</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center py-4 mt-auto">
    <p class="mb-0 footer-text">&copy; 2024 <span th:text="${profile?.name}">Himanshu Singh</span>. All rights reserved. <a href="/">Himanshu Singh</a></p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function () {
        // --- Data containers ---
        let certifications = [];
        let organizations = new Set();
        const CACHE_KEY = "certifications_cache_v1";
        const THEME_KEY = "cert_theme_v1";

        const $certTable = $("#certTableBody");
        const $orgFilter = $("#organizationFilter");
        const $search = $("#certSearch");
        const $sort = $("#sortBy");
        const $cacheNotice = $("#cacheNotice");

        // --- helpers ---
        function formatDate(d) {
            if (!d) return "-";
            try {
                const dt = new Date(d);
                if (isNaN(dt)) return d;
                return dt.toLocaleDateString();
            } catch (e) { return d; }
        }

        function sortCerts(list) {
            const mode = $sort.val();
            const copy = list.slice();
            if (mode === "name") {
                copy.sort((a,b) => (a.name||"").localeCompare(b.name||""));
            } else if (mode === "date_desc") {
                copy.sort((a,b) => new Date(b.issueDate||0) - new Date(a.issueDate||0));
            } else if (mode === "date_asc") {
                copy.sort((a,b) => new Date(a.issueDate||0) - new Date(b.issueDate||0));
            } else if (mode === "verified") {
                copy.sort((a,b) => (b.verified?1:0) - (a.verified?1:0));
            }
            return copy;
        }

        function computeStats(list) {
            const total = list.length;
            const verified = list.filter(c => c.verified).length;
            const pending = total - verified;
            const verifiedPct = total ? Math.round((verified/total) * 100) : 0;
            const pendingPct = total ? Math.round((pending/total) * 100) : 0;
            $("#totalCount").text(total);
            $("#verifiedPct").text(verifiedPct + "%");
            $("#pendingPct").text(pendingPct + "%");
        }

        // --- Render cards ---
        function renderCerts(list) {
            $certTable.empty();
            if (!list.length) {
                $certTable.append('<div class="col-12 text-center"><p>No certifications found</p></div>');
                computeStats([]);
                return;
            }
            computeStats(list);
            const sorted = sortCerts(list);
            sorted.forEach((c, index) => {
                // use provided id or fallback to index-based id
                const id = c.id || ("local-" + index + "-" + btoa((c.name||"").slice(0,20)));
                const verifiedHtml = c.verified ? '<span class="badge badge-verified"><i class="bi bi-check2-circle"></i> Verified</span>'
                    : '<span class="badge badge-pending">Pending</span>';
                const viewBtn = c.certificateUrl ? `<button class="btn btn-outline-primary btn-sm view-pdf" data-url="${c.certificateUrl}">View</button>` : '';
                const shareBtn = `<button class="btn btn-outline-info btn-sm share-cert" data-id="${id}" data-cert='${escapeHtml(JSON.stringify(c))}'><i class="bi bi-share-fill"></i> Share</button>`;
                const summaryBtn = `<button class="btn btn-outline-secondary btn-sm cert-summary" data-id="${id}" data-name="${escapeHtml(c.name||'')}" data-org="${escapeHtml(c.organization||'')}" data-date="${escapeHtml(c.issueDate||'')}" data-verified="${c.verified ? 'true' : 'false'}" data-description="${escapeHtml(c.description||'')}"><i class="bi bi-card-text"></i> Summary</button>`;

                const card = `
                <div id="cert-${escapeHtml(String(c.id || id))}" class="col-sm-12 col-md-6 col-lg-4 mb-4 fade-in">
                    <div class="card cert-card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title">${escapeHtml(c.name||'-')}</h5>
                                <h6 class="card-subtitle mb-2">
                                    <span class="org-badge">${escapeHtml(c.organization||'-')}</span>
                                </h6>
                                <p class="mb-1"><strong>Issue Date:</strong> ${escapeHtml(formatDate(c.issueDate))}</p>
                                ${c.description ? `<p class="small text-muted mb-0">${escapeHtml(c.description)}</p>` : ''}
                            </div>
                            <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 gap-1">
                                <div>${verifiedHtml}</div>
                                <div class="d-flex gap-1">
                                    ${viewBtn}
                                    ${shareBtn}
                                    ${summaryBtn}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                $certTable.append(card);
            });

            // wire up view / share / ai buttons
            $(".view-pdf").off("click").on("click", function() {
                const url = $(this).data("url");
                $("#pdfFrame").attr("src", url);
                const pdfModal = new bootstrap.Modal(document.getElementById('pdfModal'));
                pdfModal.show();
            });

            $(".share-cert").off("click").on("click", function() {
                const id = $(this).data("id");
                const link = `${window.location.origin}${window.location.pathname}#cert-${encodeURIComponent(id)}`;
                if (navigator.share) {
                    navigator.share({ title: "Certification", url: link }).catch(error => {
                        if (error.name !== "AbortError") prompt("Copy this link:", link);
                    });
                } else if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(link).then(() => {
                        alert("Share link copied to clipboard.");
                    }).catch(() => prompt("Copy this link:", link));
                } else {
                    prompt("Copy this link:", link);
                }
            });

            $(".cert-summary").off("click").on("click", function() {
                const name = $(this).data("name");
                const org = $(this).data("org");
                const date = $(this).data("date");
                const verified = $(this).data("verified") === true || $(this).data("verified") === "true";
                const description = $(this).data("description");
                const status = verified ? "verified" : "not yet verified";
                const issued = date ? `, issued ${date}` : "";
                const extra = description ? `\n\n${description}` : "";
                alert(`${name} — ${org}${issued}.\nThis credential is ${status}.${extra}`);
            });
        }

        // --- escape helpers to avoid injecting HTML ---
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
        function unescapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replaceAll('&amp;', '&')
                .replaceAll('&lt;', '<')
                .replaceAll('&gt;', '>')
                .replaceAll('&quot;', '"')
                .replaceAll('&#039;', "'");
        }
        // For storing JSON safely in attribute, we escape it
        function escapeHtmlAttr(s) {
            return escapeHtml(s).replaceAll('"','&quot;');
        }
        function unescapeHtmlAttr(s) {
            return unescapeHtml(s);
        }

        // --- Filtering logic ---
        function filterCerts() {
            const q = $search.val().toLowerCase().trim();
            const org = $orgFilter.val();
            const filtered = certifications.filter(c => {
                const name = (c.name || "").toLowerCase();
                const organization = (c.organization || "").toLowerCase();
                const matchesQuery = !q || name.includes(q) || organization.includes(q);
                const matchesOrg = !org || c.organization === org;
                return matchesQuery && matchesOrg;
            });
            renderCerts(filtered);
        }

        $search.on("input", filterCerts);
        $orgFilter.on("change", filterCerts);
        $sort.on("change", filterCerts);

        // --- Export CSV (Excel-friendly) ---
        $("#exportCsvBtn").on("click", function() {
            // export currently filtered view
            const rows = [];
            const q = $search.val().toLowerCase().trim();
            const org = $orgFilter.val();
            const filtered = certifications.filter(c => {
                const name = (c.name || "").toLowerCase();
                const organization = (c.organization || "").toLowerCase();
                const matchesQuery = !q || name.includes(q) || organization.includes(q);
                const matchesOrg = !org || c.organization === org;
                return matchesQuery && matchesOrg;
            });

            if (!filtered.length) { alert("No data to export."); return; }

            rows.push(["Name","Organization","Issue Date","Verified","Certificate URL","Description"]);
            filtered.forEach(c => {
                rows.push([
                    c.name || "",
                    c.organization || "",
                    c.issueDate || "",
                    c.verified ? "Yes" : "No",
                    c.certificateUrl || "",
                    (c.description || "").replace(/\r?\n|\r/g, " ")
                ]);
            });

            const csvContent = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "certifications_export.csv";
            a.click();
        });

        // --- Export PDF of current view (use html2canvas + jsPDF) ---
        $("#exportPdfBtn").on("click", async function() {
            const exportContainer = document.createElement("div");
            exportContainer.style.padding = "20px";
            exportContainer.style.width = "800px";
            exportContainer.style.background = document.body.classList.contains("dark-theme") ? "#0f1723" : "#ffffff";
            // build a minimal printable snapshot of current filtered certs
            const q = $search.val().toLowerCase().trim();
            const org = $orgFilter.val();
            const filtered = certifications.filter(c => {
                const name = (c.name || "").toLowerCase();
                const organization = (c.organization || "").toLowerCase();
                const matchesQuery = !q || name.includes(q) || organization.includes(q);
                const matchesOrg = !org || c.organization === org;
                return matchesQuery && matchesOrg;
            });
            if (!filtered.length) { alert("No data to export."); return; }

            const header = document.createElement("div");
            header.innerHTML = `<h2>Certifications Export</h2><p>${new Date().toLocaleString()}</p><hr/>`;
            exportContainer.appendChild(header);

            filtered.forEach(c => {
                const item = document.createElement("div");
                item.style.marginBottom = "12px";
                item.innerHTML = `<strong>${escapeHtml(c.name || "")}</strong><br/>
                                  <small>${escapeHtml(c.organization || "")} • ${escapeHtml(formatDate(c.issueDate))} • ${c.verified ? "Verified" : "Pending"}</small>
                                  <p style="margin:6px 0">${escapeHtml(c.description || "")}</p>`;
                exportContainer.appendChild(item);
            });

            document.body.appendChild(exportContainer);
            try {
                const canvas = await html2canvas(exportContainer, { scale: 2, backgroundColor: null });
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'pt', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                // fit image into page with margins
                const imgProps = { width: canvas.width, height: canvas.height };
                const ratio = Math.min(pageWidth / imgProps.width, pageHeight / imgProps.height);
                const imgWidth = imgProps.width * ratio;
                const imgHeight = imgProps.height * ratio;
                pdf.addImage(imgData, 'PNG', (pageWidth - imgWidth) / 2, 40, imgWidth, imgHeight);
                pdf.save('certifications_export.pdf');
            } catch (err) {
                console.error(err);
                alert("PDF export failed.");
            } finally {
                exportContainer.remove();
            }
        });

        // --- Theme toggle (persist in localStorage) ---
        const $themeToggle = $("#themeToggleBtn");
        function applySavedTheme() {
            const theme = localStorage.getItem(THEME_KEY) || "light";
            if (theme === "dark") {
                $("body").addClass("dark-theme");
                $themeToggle.html('<i class="bi bi-sun"></i> Light');
            } else {
                $("body").removeClass("dark-theme");
                $themeToggle.html('<i class="bi bi-moon-stars"></i> Dark');
            }
        }
        applySavedTheme();
        $themeToggle.on("click", function() {
            const isDark = $("body").hasClass("dark-theme");
            if (isDark) {
                $("body").removeClass("dark-theme");
                localStorage.setItem(THEME_KEY, "light");
                $themeToggle.html('<i class="bi bi-moon-stars"></i> Dark');
            } else {
                $("body").addClass("dark-theme");
                localStorage.setItem(THEME_KEY, "dark");
                $themeToggle.html('<i class="bi bi-sun"></i> Light');
            }
        });

        // --- Offline cache: load cached data on fetch failure ---
        function loadFromCacheIfAvailable() {
            const raw = localStorage.getItem(CACHE_KEY);
            if (!raw) return false;
            try {
                const cached = JSON.parse(raw);
                certifications = cached;
                populateOrganizations(certifications);
                renderCerts(certifications);
                $cacheNotice.removeClass("d-none");
                return true;
            } catch (e) {
                console.warn("Cache parse error", e);
                return false;
            }
        }

        // --- initial fetch of certifications ---
        function fetchCerts() {
            $certTable.html('<div class="col-12 text-center">Loading...</div>');
            $.get("/certifications/list").done(function(list) {
                // Save to cache
                certifications = list || [];
                try { localStorage.setItem(CACHE_KEY, JSON.stringify(certifications)); } catch(e){ console.warn("Cache save failed", e); }
                $cacheNotice.addClass("d-none");
                populateOrganizations(certifications);
                renderCerts(certifications);
            }).fail(function() {
                // fetch failed -> fallback to cache
                const ok = loadFromCacheIfAvailable();
                if (!ok) {
                    $certTable.html('<div class="col-12 text-center"><p class="text-danger">Unable to load certifications. Please try again later.</p></div>');
                }
            });
        }
        fetchCerts();

        // --- populate organizations filter ---
        function populateOrganizations(list) {
            organizations.clear();
            $orgFilter.empty().append('<option value="">All Organizations</option>');
            list.forEach(c => { if (c.organization) organizations.add(c.organization); });
            Array.from(organizations).sort().forEach(org => {
                $orgFilter.append(`<option value="${escapeHtml(org)}">${escapeHtml(org)}</option>`);
            });
        }

        // --- Shared link handling: load shared cert if ?sharedId=... or ?code=... present ---
        (function handleSharedLink() {
            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get("sharedId");
            const codeParam = params.get("code"); // optional encoded full cert
            if (sharedId) {
                // try load from localStorage
                const raw = localStorage.getItem("shared_cert_" + sharedId);
                if (raw) {
                    try {
                        const cert = JSON.parse(raw);
                        renderCerts([cert]);
                        showSharedBanner("Shared certificate loaded. Click 'Save to My Codes' to keep it.", sharedId, cert);
                        return;
                    } catch (e) { console.warn(e); }
                }
                // fallback: attempt server-side view by id
                $.get(`/certifications/view?id=${encodeURIComponent(sharedId)}`).done(function(serverCert) {
                    if (serverCert) {
                        renderCerts([serverCert]);
                        showSharedBanner("Shared certificate loaded from server.", sharedId, serverCert);
                    }
                }).fail(function() {
                    // do nothing (silent)
                });
            } else if (codeParam) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(codeParam));
                    renderCerts([decoded]);
                    showSharedBanner("Shared certificate loaded from URL.", "url-shared", decoded);
                } catch (e) {
                    console.warn("Invalid code param", e);
                }
            }
        })();

        function showSharedBanner(message, sharedId, cert) {
            const $placeholder = $("#sharedBannerPlaceholder");
            const banner = $(`
                <div class="alert alert-success alert-dismissible fade show mb-0" role="alert">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>${escapeHtml(message)}</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-light save-shared">Save to My Codes</button>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>
                </div>`);
            $placeholder.html(banner);
            banner.find(".save-shared").on("click", function() {
                // Save into local cache (append)
                try {
                    const cur = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
                    // prevent duplicates by name+org+date
                    const exists = cur.some(x => x.name === cert.name && x.organization === cert.organization && x.issueDate === cert.issueDate);
                    if (!exists) {
                        cur.unshift(cert);
                        localStorage.setItem(CACHE_KEY, JSON.stringify(cur));
                        alert("✅ Saved to local certifications cache.");
                    } else {
                        alert("This certificate is already in your local cache.");
                    }
                    // refresh view
                    certifications = cur;
                    populateOrganizations(certifications);
                    renderCerts(certifications);
                    banner.alert('close');
                } catch (e) {
                    console.error(e);
                    alert("Failed to save certificate locally.");
                }
            });
        }

        // --- Utility to unescape attribute JSON stored earlier ---
        function unescapeHtml(s) {
            if (!s) return s;
            return s.replaceAll('&quot;', '"').replaceAll('&#039;', "'").replaceAll('&lt;', '<').replaceAll('&gt;', '>').replaceAll('&amp;', '&');
        }
    });
</script>
</body>
</html>
