<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-in-out;
        }
        .login-card .card-header {
            background: transparent;
            border-bottom: none;
            text-align: center;
        }
        .login-card h4 {
            font-weight: 600;
            color: #333;
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-login {
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background-color: #0b5ed7;
            transform: scale(1.02);
        }
        .navbar {
            background: rgba(0, 0, 0, 0.7) !important;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-15px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page admin-page">
<nav class="navbar navbar-dark fixed-top">
    <div class="container-fluid px-4">
            <span class="navbar-brand fw-semibold">
                <i class="bi bi-shield-lock-fill me-2"></i> Admin Portal
            </span>
        <a href="/" class="btn btn-outline-light btn-sm">
            <i class="bi bi-house-door-fill me-1"></i> View Portfolio
        </a>
    </div>
</nav>

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card login-card p-4">
                <div class="card-header mb-2">
                    <h4><i class="bi bi-person-lock me-2 text-primary"></i>Admin Login</h4>
                    <p class="text-muted small mb-0">Please enter your credentials to continue</p>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
                            </div>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger py-2 text-center">
                            Invalid username or password
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-login mt-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-white-50 mt-3 small">
                © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Admin Panel | Secure Access
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
