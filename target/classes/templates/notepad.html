<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Notepad</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        /* ---------- BASE ---------- */
        :root {
            --primary: #0d6efd;
            --bg-light: #f4f7fb;
            --bg-dark: #121212;
            --card-bg-light: rgba(255, 255, 255, 0.9);
            --card-bg-dark: rgba(40, 40, 40, 0.85);
            --text-light: #1a1a1a;
            --text-dark: #f8f9fa;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            backdrop-filter: blur(10px);
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
            letter-spacing: 0.5px;
        }

        .navbar .btn {
            border-radius: 10px;
            margin-left: 5px;
            transition: transform 0.2s;
        }

        .navbar .btn:hover {
            transform: scale(1.08);
        }

        /* ---------- MAIN CONTAINER ---------- */
        .note-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 25px;
            background: var(--card-bg-light);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(12px);
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        body.dark-mode .note-container {
            background: var(--card-bg-dark);
            color: var(--text-dark);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.05);
        }

        body.dark-mode textarea {
            background: rgba(255, 255, 255, 0.05);
            border-color: #555;
            color: #fff;
        }

        body.dark-mode input#noteTitle {
            background: rgba(255, 255, 255, 0.05);
            border-color: #555;
            color: #fff;
        }

        /* ---------- TEXT AREA ---------- */
        textarea {
            flex: 1;
            resize: vertical;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
            font-family: monospace;
            background: #fff;
            color: #000;
            transition: all 0.3s ease;
            min-height: 300px;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.2);
            outline: none;
        }

        input#noteTitle {
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid #ccc;
            padding: 10px 14px;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: #0d6efd;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-top: 3px solid #007bff;
        }

        /* ---------- INDICATORS ---------- */
        .save-indicator {
            text-align: right;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .save-indicator.active {
            opacity: 1;
            color: var(--primary);
            font-weight: 500;
        }

        /* ---------- DARK MODE ---------- */
        body.dark-mode footer {
            background: #222;
            color: #aaa;
        }

        select#noteList {
            border-radius: 8px;
            border: none;
            padding: 5px 8px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .navbar .btn,
            .navbar select {
                margin-top: 5px;
                width: 100%;
            }
            .navbar .container-fluid {
                flex-wrap: wrap;
            }
        }
    </style>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="portfolio-page">

<!-- Navbar -->
<nav class="navbar navbar-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
        <div class="navbar-brand">
            <i class="fas fa-sticky-note me-2"></i>Smart Notepad
        </div>
        <div class="d-flex flex-wrap justify-content-end">
            <select id="noteList" class="form-select me-2 w-auto" aria-label="Choose a shared note"></select>
            <button id="newNote" class="btn btn-light btn-sm" type="button" title="New note" aria-label="New note"><i class="fas fa-plus"></i></button>
            <button id="saveNote" class="btn btn-success btn-sm" type="button" title="Save note" aria-label="Save note"><i class="fas fa-save"></i></button>
            <button id="deleteNote" class="btn btn-danger btn-sm" type="button" title="Delete note" aria-label="Delete note"><i class="fas fa-trash"></i></button>
            <button id="pinNote" class="btn btn-warning btn-sm" type="button" title="Pin or unpin note" aria-label="Pin or unpin note"><i class="fas fa-thumbtack"></i></button>
            <button id="pdfBtn" class="btn btn-primary btn-sm" type="button" title="Export as PDF" aria-label="Export as PDF"><i class="fas fa-file-pdf"></i></button>
            <button id="txtBtn" class="btn btn-info btn-sm" type="button" title="Export as text" aria-label="Export as text"><i class="fas fa-file-lines"></i></button>
            <button id="toggleTheme" class="btn btn-dark btn-sm" type="button" title="Toggle light or dark theme" aria-label="Toggle light or dark theme"><i class="fas fa-moon"></i></button>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-home"></i></a>
            <a href="/judge0" class="btn btn-outline-light btn-sm me-1"><i class="fas fa-code"></i></a>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <div class="alert alert-warning mb-0" role="alert">
        Notes are shared with everyone who opens this page. Do not store passwords or private information.
    </div>
</div>

<!-- Main Notepad -->
<div class="container mt-4 flex-grow-1 d-flex flex-column note-container">
    <input type="hidden" id="noteId">
    <input type="text" id="noteTitle" class="form-control mb-3" placeholder="Enter note title...">
    <textarea id="noteContent" placeholder="Start writing your note here..."></textarea>

    <div class="d-flex justify-content-between small text-muted mt-2">
        <span id="wordCount">Words: 0</span>
        <span id="charCount">Characters: 0</span>
    </div>
    <div class="save-indicator mt-2" id="saveIndicator">All changes saved</div>
</div>

<!-- Footer -->
<footer>
    &copy; 2025 <span th:text="${profile?.name}">Himanshu Singh</span>. All rights reserved.
</footer>

<!-- JS Logic -->
<script>
    const noteList = document.getElementById("noteList");
    const noteId = document.getElementById("noteId");
    const noteTitle = document.getElementById("noteTitle");
    const noteContent = document.getElementById("noteContent");
    const wordCount = document.getElementById("wordCount");
    const charCount = document.getElementById("charCount");
    const saveIndicator = document.getElementById("saveIndicator");
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    let lastSavedContent = "";
    let isSaving = false;
    let autoSaveEnabled = true;
    let pinnedNotes = JSON.parse(localStorage.getItem("pinnedNotes") || "[]");
    let allNotes = [];

    async function loadNotes() {
        try {
            const res = await fetch("/notes/all");
            if (!res.ok) throw new Error(`Failed to load notes (${res.status})`);
            allNotes = await res.json();
            populateNoteList(allNotes);
        } catch (e) {
            console.error("Failed to load notes:", e);
            showSaveStatus("Could not load shared notes.", false);
        }
    }

    function populateNoteList(notes) {
        const pinned = [];
        const others = [];
        const pinnedSet = new Set(pinnedNotes.map(String));
        notes.forEach(n => pinnedSet.has(String(n.id)) ? pinned.push(n) : others.push(n));

        noteList.innerHTML = `<option value="">Select Note</option>`;
        [...pinned, ...others].forEach(n => {
            const option = document.createElement("option");
            option.value = n.id;
            option.textContent = pinnedSet.has(String(n.id)) ? "📌 " + n.title : n.title;
            noteList.appendChild(option);
        });
    }

    noteList.addEventListener("change", async () => {
        const id = noteList.value;
        if (!id) return;
        try {
            const res = await fetch(`/notes/${id}`);
            if (!res.ok) throw new Error(`Failed to load note (${res.status})`);
            const note = await res.json();
            fillNote(note);
        } catch {
            const note = allNotes.find(n => String(n.id) === String(id));
            if (note) fillNote(note);
        }
    });

    function fillNote(note) {
        noteId.value = note.id;
        noteTitle.value = note.title;
        noteContent.value = note.content;
        updateCounts();
        lastSavedContent = currentNoteKey();
        showSaveStatus("All changes saved");
    }

    async function saveNote(isManual = false) {
        const currentContent = currentNoteKey();
        if (isSaving) return false;
        if (!noteTitle.value.trim() && !noteContent.value.trim()) {
            if (isManual) showSaveStatus("Write a title or note before saving.", false);
            return false;
        }
        if (currentContent === lastSavedContent) {
            if (isManual) alert("✅ Note saved successfully!");
            return true;
        }

        isSaving = true;
        showSaveStatus("Saving...", true);

        const note = {
            id: noteId.value || null,
            title: noteTitle.value.trim() || "Untitled",
            content: noteContent.value
        };
        try {
            const res = await fetch("/notes/save", {
                method: "POST",
                headers: { "Content-Type": "application/json", [csrfHeader]: csrfToken },
                body: JSON.stringify(note)
            });
            if (res.ok) {
                const saved = await res.json();
                noteId.value = saved.id;
                noteTitle.value = saved.title;
                lastSavedContent = currentNoteKey();
                showSaveStatus("All changes saved");
                updateLocalNotes(saved);
                noteList.value = String(saved.id);
                if (isManual) alert("✅ Note saved successfully!");
                return true;
            }
            showSaveStatus("Error saving!", false);
            return false;
        } catch (e) {
            console.error("Failed to save note:", e);
            showSaveStatus("Failed to connect!", false);
            return false;
        } finally {
            isSaving = false;
        }
    }

    function updateLocalNotes(savedNote) {
        const idx = allNotes.findIndex(n => String(n.id) === String(savedNote.id));
        if (idx >= 0) allNotes[idx] = savedNote;
        else allNotes.unshift(savedNote);
        populateNoteList(allNotes);
    }

    document.getElementById("saveNote").addEventListener("click", () => saveNote(true));

    function showSaveStatus(msg, saving = false) {
        saveIndicator.innerHTML = msg;
        saveIndicator.classList.add("active");
        if (!saving) setTimeout(() => saveIndicator.classList.remove("active"), 2000);
    }

    setInterval(() => { if (autoSaveEnabled) saveNote(false); }, 5000);

    document.getElementById("newNote").addEventListener("click", async () => {
        if (isSaving) {
            showSaveStatus("Wait for the current save to finish.", true);
            return;
        }
        const hasUnsavedText = (noteTitle.value.trim() || noteContent.value.trim())
            && currentNoteKey() !== lastSavedContent;
        if (hasUnsavedText && !(await saveNote(false))) return;
        clearNoteFields();
        autoSaveEnabled = false;
        showSaveStatus("New note — not yet saved", true);
        setTimeout(() => autoSaveEnabled = true, 3000);
    });

    document.getElementById("deleteNote").addEventListener("click", async () => {
        const id = noteList.value || noteId.value;
        if (!id) return alert("Please select a note to delete!");
        if (!confirm("Are you sure you want to delete this note?")) return;
        try {
            const response = await fetch(`/notes/${id}`, {
                method: "DELETE",
                headers: { [csrfHeader]: csrfToken }
            });
            if (!response.ok) throw new Error(`Delete failed (${response.status})`);
        } catch (e) {
            console.error("Failed to delete note:", e);
            showSaveStatus("Could not delete note.", false);
            return;
        }
        allNotes = allNotes.filter(n => String(n.id) !== String(id));
        populateNoteList(allNotes);
        alert("🗑️ Note deleted successfully!");
        clearNoteFields();
    });

    document.getElementById("pinNote").addEventListener("click", () => {
        const id = noteList.value || noteId.value;
        if (!id) return alert("Select a note first!");
        const sId = String(id);
        if (pinnedNotes.includes(sId)) pinnedNotes = pinnedNotes.filter(x => x !== sId);
        else pinnedNotes.push(sId);
        localStorage.setItem("pinnedNotes", JSON.stringify(pinnedNotes));
        populateNoteList(allNotes);
    });

    noteContent.addEventListener("input", updateCounts);
    function updateCounts() {
        const text = noteContent.value;
        const trimmedText = text.trim();
        const words = trimmedText ? trimmedText.split(/\s+/).length : 0;
        wordCount.textContent = `Words: ${words}`;
        charCount.textContent = `Characters: ${text.length}`;
    }

    document.getElementById("txtBtn").addEventListener("click", () => {
        const title = noteTitle.value || "Untitled";
        const text = noteContent.value || "";
        const blob = new Blob([title + "\n\n" + text], { type: "text/plain" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = safeFilename(title) + ".txt";
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });

    document.getElementById("pdfBtn").addEventListener("click", () => {
        const jsPDF = window.jspdf?.jsPDF;
        if (!jsPDF) {
            showSaveStatus("PDF export is unavailable. Please reload and try again.", false);
            return;
        }
        const doc = new jsPDF();
        const title = noteTitle.value || "Untitled Note";
        const text = noteContent.value || "No content available";
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 15;
        const lineHeight = 6;
        const titleLines = doc.splitTextToSize(title, pageWidth - margin * 2);
        const textLines = doc.splitTextToSize(text, pageWidth - margin * 2);
        let y = margin;
        doc.setFontSize(18);
        doc.text(titleLines, margin, y);
        y += titleLines.length * 8 + 5;
        doc.setFontSize(12);
        textLines.forEach(line => {
            if (y > pageHeight - margin) {
                doc.addPage();
                y = margin;
            }
            doc.text(line, margin, y);
            y += lineHeight;
        });
        doc.save(safeFilename(title) + ".pdf");
    });

    function safeFilename(value) {
        return (value || "Untitled").replace(/[\\/:*?"<>|]/g, "_").trim() || "Untitled";
    }

    const themeBtn = document.getElementById("toggleTheme");
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark-mode");
    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
    });

    function clearNoteFields() {
        noteId.value = ""; noteTitle.value = ""; noteContent.value = ""; noteList.value = ""; lastSavedContent = "";
        updateCounts();
    }

    function currentNoteKey() {
        return JSON.stringify([noteTitle.value.trim(), noteContent.value]);
    }

    loadNotes();
</script>
</body>
</html>
