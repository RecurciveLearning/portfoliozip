<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blog.title} + ' - Blog'">Blog</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #f9fafb, #eef1f5);
            transition: background 0.4s, color 0.4s;
        }

        /* Navbar */
        .navbar {
            background-color: #0d6efd;
            transition: background 0.3s ease;
        }

        .nav-link.active { text-decoration: underline; }

        /* Header Section */
        h1 {
            font-weight: 700;
            color: #0d6efd;
        }

        .blog-meta {
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* Blog Image */
        .blog-image-wrapper {
            max-width: 600px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .blog-image {
            width: 60%;
            transition: transform 0.4s ease;
        }

        .blog-image:hover { transform: scale(1.05); }

        /* Blog Content */
        .blog-content {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
            margin-top: 1.5rem;
        }

        /* Recommended Blogs */
        .recommended {
            background-color: #f8f9fa;
            padding: 3rem 0;
            border-top: 1px solid #e9ecef;
        }

        .recommended .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recommended .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .recommended .card-img-top {
            height: 180px;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background-color: #0d6efd;
            color: #fff;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }

        /* Floating Buttons */
        .floating-btn {
            position: fixed;
            bottom: 25px;
            right: 20px;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s;
        }

        .floating-btn:hover { transform: scale(1.1); }

        #themeBtn { background-color: #6f42c1; right: 20px; bottom: 90px; }
        #copyBtn { background-color: #198754; }

        /* Scroll Progress Bar */
        #scrollProgress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 5px;
            background: #0d6efd;
            z-index: 2000;
            transition: width 0.25s ease;
        }

        /* Dark Mode */
        body.dark {
            background: #181818;
            color: #e9ecef;
        }

        body.dark .navbar, body.dark footer {
            background-color: #111;
        }

        body.dark .card, body.dark .blog-content {
            background-color: #1f1f1f;
            color: #f8f9fa;
        }

        body.dark h1 { color: #0dcaf0; }
    </style>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page">

<!-- Scroll Progress -->
<div id="scrollProgress"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Himanshu Singh</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbarNav" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="/blogs">Blogs</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Blog Section -->
<section class="py-5" style="margin-top:80px;">
    <div class="container text-center">
        <h1 th:text="${blog.title}">Blog Title</h1>
        <p class="blog-meta mb-4">
            <i class="fa fa-calendar"></i>
            <span th:text="${#temporals.format(blog.createdAt,'MMM dd, yyyy')}">Jan 01, 2024</span> |
            <i class="fa fa-clock"></i> <span id="readingTime">3 min read</span>
        </p>

        <!-- Blog Image -->
        <div class="blog-image-wrapper mb-4" th:if="${blog.imageUrl != null}">
            <img th:src="${blog.imageUrl}" alt="Blog Image" class="blog-image">
        </div>

        <!-- Image URL (shortened) -->
        <div th:if="${shortImageUrl != null}" class="small text-muted mb-3">
            <i class="fa fa-link"></i> <span th:text="${shortImageUrl}"></span>
        </div>

        <!-- Blog Content -->
        <div class="text-start blog-content" th:utext="${blog.content}">
            Blog content goes here...
        </div>

        <!-- Share Buttons -->
        <div class="mt-5 text-start">
            <span class="fw-semibold">Share this post:</span>
            <a th:href="'https://twitter.com/intent/tweet?url=' + ${currentUrl}" target="_blank" class="btn btn-sm btn-outline-primary me-1"><i class="fab fa-twitter"></i></a>
            <a th:href="'https://www.linkedin.com/shareArticle?url=' + ${currentUrl}" target="_blank" class="btn btn-sm btn-outline-info me-1"><i class="fab fa-linkedin"></i></a>
            <a th:href="'https://www.facebook.com/sharer/sharer.php?u=' + ${currentUrl}" target="_blank" class="btn btn-sm btn-outline-primary me-1"><i class="fab fa-facebook"></i></a>
            <a th:href="'mailto:?subject=' + ${blog.title} + '&body=' + ${currentUrl}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
</section>

<!-- Recommended Blogs -->
<section class="recommended" th:if="${recommendedBlogs}">
    <div class="container">
        <h3 class="text-center mb-4">Recommended Blogs</h3>
        <div class="row g-4">
            <div class="col-md-4" th:each="b : ${recommendedBlogs}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${b.image != null}" th:src="${b.image}" class="card-img-top" alt="Recommended Blog">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${b.title}">Recommended Blog</h5>
                        <p class="card-text" th:text="${b.summary}">Short description...</p>
                        <a th:href="@{'/blogs/' + ${b.id}}" class="btn btn-outline-primary btn-sm">Read More</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-center py-4 mt-5">
    <p class="mb-0">&copy; 2025 Himanshu Singh. All rights reserved.</p>
</footer>

<!-- Floating Buttons -->
<div id="themeBtn" class="floating-btn"><i class="fas fa-moon"></i></div>
<div id="copyBtn" class="floating-btn"><i class="fas fa-share-alt"></i></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /* 🌗 Theme Toggle */
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.onclick = () => {
        document.body.classList.toggle('dark');
        const dark = document.body.classList.contains('dark');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        themeBtn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    };
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
    }

    /* 🧠 Reading Time Estimator */
    const content = document.querySelector('.blog-content');
    if (content) {
        const words = content.innerText.trim().split(/\s+/).length;
        const minutes = Math.ceil(words / 200);
        document.getElementById('readingTime').innerText = `${minutes} min read`;
    }

    /* 🔗 Copy Link */
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.onclick = () => {
        navigator.clipboard.writeText(window.location.href);
        copyBtn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => copyBtn.innerHTML = '<i class="fas fa-share-alt"></i>', 1500);
    };

    /* 📈 Scroll Progress Bar */
    window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.body.scrollHeight - window.innerHeight;
        const scrollPercent = (scrollTop / docHeight) * 100;
        document.getElementById('scrollProgress').style.width = scrollPercent + '%';
    });
</script>
</body>
</html>
