<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${blog.id != null ? 'Edit Blog' : 'Create Blog'}">Create Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: "Poppins", sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg, #212529, #343a40);
    }

    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .form-control, .form-select {
      border-radius: 0.5rem;
    }

    .btn-primary {
      background: #0d6efd;
      border: none;
      border-radius: 0.5rem;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background: #0b5ed7;
      transform: translateY(-1px);
    }

    footer {
      background: #212529;
    }

    .page-title {
      font-weight: 600;
      color: #212529;
    }

    label {
      font-weight: 500;
    }

    textarea {
      resize: vertical;
    }
  </style>
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/secondary.css" rel="stylesheet">
  <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page admin-page">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🧠 My Blog</a>
  </div>
</nav>

<!-- Blog Form -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="text-center mb-4">
        <h2 class="page-title" th:text="${blog.id != null ? 'Edit Blog Post' : 'Create a New Blog'}">Create a New Blog</h2>
        <p class="text-muted">Write and manage a portfolio post.</p>
      </div>

      <div class="card p-4 p-md-5">
        <form th:action="@{/blogs/save}" th:object="${blog}" method="post">
          <!-- CSRF Token -->
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" th:field="*{id}">

          <!-- Title -->
          <div class="form-floating mb-4">
            <input type="text" class="form-control" th:field="*{title}" id="title" placeholder="Enter blog title" required>
            <label for="title">Title</label>
          </div>

          <!-- Image URL -->
          <div class="form-floating mb-4">
            <input type="text" class="form-control" th:field="*{image}" id="image" placeholder="https://example.com/image.jpg">
            <label for="image">Image URL</label>
          </div>

          <!-- Content -->
          <div class="mb-4">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" th:field="*{content}" id="content" rows="8" placeholder="Write your blog content..." required></textarea>
            <small class="text-muted">You can use basic HTML tags (e.g. &lt;p&gt;, &lt;b&gt;, &lt;h2&gt;)</small>
          </div>

          <!-- Category -->
          <div class="mb-4">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" th:field="*{category.id}" id="category">
              <option value="" disabled selected>-- Select Existing Category --</option>
              <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>

            <div class="mt-3">
              <label class="form-label">Or Add a New Category</label>
              <input type="text" class="form-control" name="categoryName" placeholder="New category name (optional)">
            </div>
          </div>

          <!-- Submit -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">
              <i class="bi bi-save"></i> Save Blog
            </button>
          </div>
        </form>

        <!-- Success message -->
        <div th:if="${param.success}" class="alert alert-success mt-4 mb-0 text-center">
          ✅ Blog saved successfully!
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center text-white py-3 mt-5">
  <p class="mb-0">&copy; 2025 Himanshu Singh · Admin Panel</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
