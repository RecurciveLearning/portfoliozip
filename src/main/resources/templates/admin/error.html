<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/secondary.css" rel="stylesheet">
    <script src="/js/page-theme.js" defer></script>
</head>
<body class="portfolio-page admin-page">
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid justify-content-between">
            <span class="navbar-brand">Admin Error</span>
            <a href="/" class="btn btn-outline-light">Go to Portfolio Home</a>
        </div>
    </nav>
    <div class="error-page-container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
        <div class="error-card shadow-lg">
            <div class="card-header text-white text-center">
                <h2>Logout Error</h2>
            </div>
            <div class="card-body text-center">
                <p class="lead mb-3">An error occurred during admin logout.</p>
                <p>Please try again or return to the portfolio home page.</p>
                <div class="error-btns">
                    <a href="/" class="btn btn-primary">Portfolio Home</a>
                    <a href="/admin/login" class="btn btn-secondary">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
